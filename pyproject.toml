[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-bridge"
version = "0.8.2"
description = "Give a cloud AI agent controlled access to your own machine — Python bridge is deprecated, use npm/brew (Node) for new features (0.8.x security-only, 0.9 shim)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "arena", "agent", "agent-mode", "remote-control", "macos", "chrome", "cdp", "peekaboo", "automation", "sandbox", "mcp-server"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Development Status :: 7 - Inactive"  # Python bridge deprecated in 0.8, use npm/brew,
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
arena-bridge = "arena_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/vernikr/arena-bridge"
Repository = "https://github.com/vernikr/arena-bridge"
Issues = "https://github.com/vernikr/arena-bridge/issues"
Changelog = "https://github.com/vernikr/arena-bridge/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["arena_bridge"]
