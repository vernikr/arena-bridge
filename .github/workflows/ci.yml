name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'feature-tree.md'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - if: runner.os == 'macOS'
        run: python3 test/helper_signals.py

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 test/test_bridge.py
      - run: python3 test/test_approvals.py
      - run: python3 test/test_browser.py
      - run: python3 test/test_mac.py
      - run: python3 test/test_service.py
      - run: python3 test/test_telegram.py

  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash macos/ArenaBridge/build.sh

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node -e "const pkg=require('./package.json'); const fs=require('fs'); const py=fs.readFileSync('arena_bridge/__init__.py','utf8'); if(!py.includes(pkg.version) && !fs.readFileSync('pyproject.toml','utf8').includes(pkg.version)) { console.error('version mismatch'); process.exit(1)}; console.log('version ok', pkg.version)"
