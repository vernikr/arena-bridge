name: release

on:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC); no npm token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@11 && npm -v
      - run: npm test
      - run: npm publish --access public

  pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install build twine
      - run: python -m build
      - run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: [npm, pypi]
    if: success()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: build the npm package
        run: |
          npm pack
          mv arena-bridge-*.tgz arena-bridge-npm.tgz
      - name: build the python package
        run: |
          pip install build
          python -m build
      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shasum -a 256 arena-bridge-npm.tgz dist/*.tar.gz dist/*.whl > SHA256SUMS || sha256sum arena-bridge-npm.tgz dist/*.tar.gz dist/*.whl > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            arena-bridge-npm.tgz \
            dist/*.tar.gz \
            dist/*.whl \
            SHA256SUMS \
            --title "arena-bridge $GITHUB_REF_NAME" \
            --generate-notes

  macos:
    runs-on: macos-latest
    needs: [release]
    if: success()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: test helper signals
        run: python3 test/helper_signals.py
      - name: import the signing certificate
        env:
          P12_B64: ${{ secrets.ARENA_SIGN_P12 }}
          P12_PASS: ${{ secrets.ARENA_SIGN_P12_PASSWORD }}
        run: |
          [ -n "$P12_B64" ] || { echo "no signing certificate secret: skipping"; exit 0; }
          KC="$RUNNER_TEMP/sign.keychain-db"; KCPW=$(openssl rand -hex 16)
          printf '%s' "$P12_B64" | tr -d ' \r\n\t' | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d ' "')
          rm -f "$RUNNER_TEMP/sign.p12"
      - name: build the app for both architectures
        env:
          ARENA_SIGN_IDENTITY: ${{ secrets.ARENA_SIGN_P12 != '' && 'Arena Bridge Local' || '' }}
        run: |
          [ -n "$ARENA_SIGN_IDENTITY" ] || echo "::warning::no signing certificate: the apps are ad-hoc signed and permissions reset after updates"
          chmod +x macos/ArenaBridge/build.sh
          for arch in arm64 x86_64; do
            (cd macos/ArenaBridge && ARCH=$arch ./build.sh)
            codesign -dv "macos/ArenaBridge/dist/Arena Bridge.app" 2>&1 | grep -m1 "^Authority" || true
            rm -rf "$RUNNER_TEMP/dmg" && mkdir "$RUNNER_TEMP/dmg"
            cp -R "macos/ArenaBridge/dist/Arena Bridge.app" "$RUNNER_TEMP/dmg/"
            ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
            hdiutil create -quiet -volname "Arena Bridge" -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "$GITHUB_WORKSPACE/Arena-Bridge-$arch.dmg"
            rm -rf "$RUNNER_TEMP/dmg" "macos/ArenaBridge/dist"
          done
      - name: generate SHA256SUMS for apps
        run: shasum -a 256 Arena-Bridge-*.dmg > SHA256SUMS-apps
      - name: attach the apps and checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS -O SHA256SUMS
          cat SHA256SUMS-apps >> SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" Arena-Bridge-arm64.dmg Arena-Bridge-x86_64.dmg SHA256SUMS --clobber
