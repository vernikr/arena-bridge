name: release

on:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install build twine
      - run: python -m build
      - run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: [npm, pypi]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: build the npm package
        run: |
          npm pack
          mv arena-bridge-*.tgz arena-bridge-npm.tgz
      - name: build the python package
        run: |
          pip install build
          python -m build
      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            arena-bridge-npm.tgz \
            dist/*.tar.gz \
            dist/*.whl \
            --title "arena-bridge $GITHUB_REF_NAME" \
            --generate-notes

  macos:
    runs-on: macos-latest
    needs: [release]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: test helper signals
        run: python3 test/helper_signals.py
      - name: build the app for both architectures
        run: |
          chmod +x macos/ArenaBridge/build.sh
          for arch in arm64 x86_64; do
            (cd macos/ArenaBridge && ARCH=$arch ./build.sh)
            cp -R "macos/ArenaBridge/dist/Arena Bridge.app" "/tmp/Arena Bridge.app"
            (cd /tmp && zip -qry "$RUNNER_TEMP/Arena-Bridge-$arch.zip" "Arena Bridge.app")
            rm -rf "/tmp/Arena Bridge.app" "macos/ArenaBridge/dist"
          done
          mv "$RUNNER_TEMP"/Arena-Bridge-*.zip "$GITHUB_WORKSPACE"
      - name: attach the apps to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" Arena-Bridge-arm64.zip Arena-Bridge-x86_64.zip --clobber
